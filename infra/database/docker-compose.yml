services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: ta-passando-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ta_passando
      POSTGRES_USER: ta_passando
      POSTGRES_PASSWORD: ta_passando_dev
    ports:
      - "5432:5432"
    volumes:
      - ta_passando_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ta_passando -d ta_passando"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ta_passando_postgres_data:

